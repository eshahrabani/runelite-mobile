pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo.runelite.net' } // RuneLite custom maven repository
    }
}

rootProject.name = 'runelite-mobile'
include ':core'
include ':android'
include ':ios'
