buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.ow2.asm:asm:9.6'
        classpath 'org.ow2.asm:asm-commons:9.6'
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'org.runelite.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "org.runelite.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Base URL the app downloads the pre-dexed client from. Override with
        // -PdistBase=<url>/ to serve the three release-named files from any
        // static host (offline verification). Trailing slash required.
        buildConfigField "String", "DIST_BASE", "\"${project.findProperty('distBase') ?: 'https://github.com/eshahrabani/runelite-mobile/releases/latest/download/'}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Gradle task to download RuneLite's injected client and compile it to Dex format
def ClientUpdaterVersionFile = "client-version.txt"

task downloadAndDexJar {
    doLast {
        def buildToolsDir = new File(android.sdkDirectory, "build-tools")
        if (!buildToolsDir.exists()) {
            throw new GradleException("Android SDK build-tools directory not found: " + buildToolsDir.absolutePath)
        }
        def latestBuildTool = buildToolsDir.listFiles()?.sort()?.last()
        if (!latestBuildTool) {
            throw new GradleException("No Android SDK build-tools version found in: " + buildToolsDir.absolutePath)
        }
        
        def d8Path = new File(latestBuildTool, "d8")
        if (System.getProperty("os.name").toLowerCase().contains("windows")) {
            d8Path = new File(latestBuildTool, "d8.bat")
        }
        
        // Ensure assets and temp directories exist
        def assetsDir = new File(projectDir, "src/main/assets")
        assetsDir.mkdirs()
        def tempDir = new File(project.buildDir, "temp-jars")
        tempDir.mkdirs()
        
        // 1. Parse bootstrap.json from RuneLite to get active client version
        println "Fetching RuneLite bootstrap.json..."
        def bootstrapUrl = new URL("https://static.runelite.net/bootstrap.json")
        def bootstrapText = bootstrapUrl.text
        def bootstrapJson = new groovy.json.JsonSlurper().parseText(bootstrapText)
        
        // Find the client artifact to extract the version number
        def clientArtifact = bootstrapJson.artifacts.find { it.name.startsWith("client-") && it.name.endsWith(".jar") }
        if (!clientArtifact) {
            throw new GradleException("Could not find client artifact in bootstrap.json!")
        }
        // Extract version from artifact name: "client-1.12.28.jar" -> "1.12.28"
        def versionMatcher = (clientArtifact.name =~ /client-(.+)\.jar/)
        if (!versionMatcher.matches()) {
            throw new GradleException("Could not parse version from artifact name: " + clientArtifact.name)
        }
        def clientVersion = versionMatcher[0][1]
        println "Active RuneLite client version: " + clientVersion
        
        // 2. Download injected-client JAR (the real pre-patched OSRS game client)
        def injectedClientUrl = new URL("https://repo.runelite.net/net/runelite/injected-client/${clientVersion}/injected-client-${clientVersion}.jar")
        def injectedClientJar = new File(tempDir, "injected-client.jar")
        println "Downloading injected-client from: " + injectedClientUrl
        injectedClientUrl.openStream().withStream { is ->
            injectedClientJar.withOutputStream { os ->
                os << is
            }
        }
        println "  -> Downloaded: " + injectedClientJar.length() + " bytes"
        
        // 2b. Clean/transform the injected-client JAR to replace invokedynamic string concatenations
        println "Transforming injected-client to remove Java 9+ invokedynamic string concatenations..."
        def cleanedClientJar = new File(tempDir, "injected-client-cleaned.jar")
        new java.util.zip.ZipFile(injectedClientJar).withCloseable { clientZip ->
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(cleanedClientJar)).withStream { zos ->
                clientZip.entries().each { entry ->
                    zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                    if (!entry.isDirectory()) {
                        clientZip.getInputStream(entry).withStream { zis ->
                            byte[] bytes = zis.bytes
                            if (entry.name.endsWith(".class")) {
                                // Transform EVERY class. The old per-class gate (hasConcat /
                                // hasUnsafe / hasBeacon byte-scans plus a hardcoded class-name
                                // list) skipped classes whose only Android-hostile feature is a
                                // dynamic constant -- e.g. ar.class in clients >= 1.13 -- which
                                // d8 then rejects with "Unsupported dynamic constant".
                                // transformClassBytes returns the same array instance when it
                                // changed nothing, so identity is the change test.
                                try {
                                    byte[] transformed = transformClassBytes(bytes)
                                    if (transformed != bytes) {
                                        println "  Transformed class: " + entry.name
                                    }
                                    bytes = transformed
                                } catch (Exception e) {
                                    throw new GradleException("Transform failed for " + entry.name, e)
                                }
                            }
                            zos.write(bytes)
                        }
                    }
                    zos.closeEntry()
                }
            }
        }
        println "  Cleaned client JAR: " + cleanedClientJar.length() + " bytes (original: " + injectedClientJar.length() + " bytes)"

        // 3. Download runelite-api JAR (interfaces and types referenced by the injected client)
        def apiUrl = new URL("https://repo.runelite.net/net/runelite/runelite-api/${clientVersion}/runelite-api-${clientVersion}.jar")
        def apiJar = new File(tempDir, "runelite-api.jar")
        println "Downloading runelite-api from: " + apiUrl
        apiUrl.openStream().withStream { is ->
            apiJar.withOutputStream { os ->
                os << is
            }
        }
        println "  -> Downloaded: " + apiJar.length() + " bytes"
        
        // 4. Strip duplicate classes from api JAR that already exist in injected-client
        // (e.g. com.jagex.oldscape.pub.OAuthApi exists in both JARs)
        println "Stripping duplicate classes from runelite-api..."
        def injectedEntries = new java.util.zip.ZipFile(cleanedClientJar).entries().collect { it.name }.toSet()
        def cleanedApiJar = new File(tempDir, "runelite-api-cleaned.jar")
        new java.util.zip.ZipFile(apiJar).withCloseable { apiZip ->
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(cleanedApiJar)).withStream { zos ->
                apiZip.entries().each { entry ->
                    if (!injectedEntries.contains(entry.name)) {
                        zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        if (!entry.isDirectory()) {
                            apiZip.getInputStream(entry).withStream { zis ->
                                zos << zis
                            }
                        }
                        zos.closeEntry()
                    } else if (entry.name.endsWith(".class")) {
                        println "  Stripped duplicate: " + entry.name
                    }
                }
            }
        }
        println "  Cleaned API JAR: " + cleanedApiJar.length() + " bytes"
        
        // 5. Compile both JARs together to Dex format
        println "Compiling injected-client + runelite-api to Dex format using: " + d8Path.absolutePath
        def destJar = new File(assetsDir, "runelite-dex.jar")
        
        exec {
            commandLine d8Path.absolutePath,
                "--min-api", "26",
                "--output", destJar.absolutePath,
                cleanedClientJar.absolutePath,
                cleanedApiJar.absolutePath
        }
        // 6. Copy resource files (non-class files) from original JARs into the dexed JAR
        println "Copying resources from client and API jars to dexed jar..."
        def tempDexDir = new File(tempDir, "dex-extracted")
        if (tempDexDir.exists()) tempDexDir.deleteDir()
        tempDexDir.mkdirs()
        
        // Extract dex file from the dexed JAR
        new java.util.zip.ZipFile(destJar).withCloseable { zip ->
            zip.entries().each { entry ->
                if (entry.name.endsWith(".dex")) {
                    def outFile = new File(tempDexDir, entry.name)
                    outFile.parentFile.mkdirs()
                    zip.getInputStream(entry).withStream { is ->
                        outFile.withOutputStream { os -> os << is }
                    }
                }
            }
        }
        
        // Repackage the dex file with resources from input jars
        new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(destJar)).withStream { zos ->
            // Add the compiled .dex files
            tempDexDir.eachFileRecurse { file ->
                if (file.isFile()) {
                    def relPath = tempDexDir.toURI().relativize(file.toURI()).toString()
                    zos.putNextEntry(new java.util.zip.ZipEntry(relPath))
                    file.withInputStream { is -> zos << is }
                    zos.closeEntry()
                }
            }
            
            // Add non-class resources from cleanedClientJar
            new java.util.zip.ZipFile(cleanedClientJar).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.isDirectory() && !entry.name.endsWith(".class") && !entry.name.startsWith("META-INF/")) {
                        zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                        zip.getInputStream(entry).withStream { is -> zos << is }
                        zos.closeEntry()
                    }
                }
            }
            
            // Add non-class resources from cleanedApiJar
            new java.util.zip.ZipFile(cleanedApiJar).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (!entry.isDirectory() && !entry.name.endsWith(".class") && !entry.name.startsWith("META-INF/")) {
                        try {
                            zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            zip.getInputStream(entry).withStream { is -> zos << is }
                            zos.closeEntry()
                        } catch (java.util.zip.ZipException ze) {
                            // duplicate entry, ignore
                        }
                    }
                }
            }
            
            // Generate runelite/index resource file to prevent NPE in OverlayIndex
            zos.putNextEntry(new java.util.zip.ZipEntry("runelite/index"))
            zos.write(new byte[]{(byte)0xFF, (byte)0xFF, (byte)0xFF, (byte)0xFF})
            zos.closeEntry()
        }
        println "RuneLite injected client successfully dexed and bundled! (" + destJar.length() + " bytes)"

        // 7. Record the baked-in client version so the app can detect updates at runtime
        def versionFile = new File(assetsDir, ClientUpdaterVersionFile)
        versionFile.write(clientVersion)
        println "Wrote client version marker: " + versionFile.absolutePath + " (v" + clientVersion + ")"
    }
}

// Hook the task into the preBuild lifecycle
project.afterEvaluate {
    tasks.findByName("preBuild").dependsOn(downloadAndDexJar)
}

configurations {
    all {
        exclude group: 'com.google.guava', module: 'listenablefuture'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Dependencies referenced by the injected client at runtime
    implementation 'com.google.guava:guava:23.2-jre'
    implementation 'org.slf4j:slf4j-api:1.7.25'
}

byte[] transformClassBytes(byte[] classBytes) {
    org.objectweb.asm.ClassReader reader = new org.objectweb.asm.ClassReader(classBytes)
    org.objectweb.asm.tree.ClassNode classNode = new org.objectweb.asm.tree.ClassNode()
    reader.accept(classNode, 0)

    boolean modified = false

    // Inject the scene snapshot into the in-game frame loop: client.ij calls
    // gp.az (the 3D scene render) and then draws the 2D UI on top. The hook
    // runs right AFTER the scene render (read-only diagnostic snapshot of the
    // display buffer at the moment the scene has drawn, before the UI pass).
    if (classNode.name == "client") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "ij" && method.desc == "(I)V") {
                for (org.objectweb.asm.tree.AbstractInsnNode insn : method.instructions.toArray()) {
                    if (insn instanceof org.objectweb.asm.tree.MethodInsnNode) {
                        org.objectweb.asm.tree.MethodInsnNode min = (org.objectweb.asm.tree.MethodInsnNode) insn
                        if (min.opcode == org.objectweb.asm.Opcodes.INVOKEVIRTUAL
                            && min.owner == "gp" && min.name == "az" && min.desc == "(IILvv;III)V") {
                            org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                            inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                            inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                                org.objectweb.asm.Opcodes.INVOKESTATIC,
                                "org/runelite/mobile/TileCompositor",
                                "composite",
                                "(Ljava/lang/Object;)V",
                                false))
                            org.objectweb.asm.tree.AbstractInsnNode next = min.getNext()
                            if (next == null) {
                                method.instructions.add(inj)
                            } else {
                                method.instructions.insertBefore(next, inj)
                            }
                            modified = true
                            println "  [ASM] Injected TileCompositor.composite into client.ij after gp.az"
                            break
                        }
                    }
                }
            }
        }
    }

    if (classNode.name == "client") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "ij" && method.desc == "(I)V") {
                for (org.objectweb.asm.tree.AbstractInsnNode insn : method.instructions.toArray()) {
                    if (insn instanceof org.objectweb.asm.tree.MethodInsnNode) {
                        org.objectweb.asm.tree.MethodInsnNode min = (org.objectweb.asm.tree.MethodInsnNode) insn
                        if (min.opcode == org.objectweb.asm.Opcodes.INVOKEVIRTUAL
                            && min.owner == "client" && min.name == "iz" && min.desc == "(I)V") {
                            org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                            inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                            inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                                org.objectweb.asm.Opcodes.INVOKESTATIC,
                                "org/runelite/mobile/TileCompositor",
                                "compositeEnd",
                                "(Ljava/lang/Object;)V",
                                false))
                            org.objectweb.asm.tree.AbstractInsnNode next = min.getNext()
                            if (next == null) {
                                method.instructions.add(inj)
                            } else {
                                method.instructions.insertBefore(next, inj)
                            }
                            modified = true
                            println "  [ASM] Injected TileCompositor.compositeEnd into client.ij after client.iz"
                            break
                        }
                    }
                }
            }
        }
    }

    if (classNode.name == "fu") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "ax" && method.desc == "(DILva;)Z") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceTileEnter",
                    "(Ljava/lang/Object;)V",
                    false))
                method.instructions.insert(inj)
                for (org.objectweb.asm.tree.AbstractInsnNode insn : method.instructions.toArray()) {
                    if (insn instanceof org.objectweb.asm.tree.JumpInsnNode
                        && insn.opcode == org.objectweb.asm.Opcodes.IFNONNULL
                        && insn.label != null) {
                        org.objectweb.asm.tree.InsnList inj2 = new org.objectweb.asm.tree.InsnList()
                        inj2.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                        inj2.add(new org.objectweb.asm.tree.MethodInsnNode(
                            org.objectweb.asm.Opcodes.INVOKESTATIC,
                            "org/runelite/mobile/TileCompositor",
                            "traceTileRender",
                            "(Ljava/lang/Object;)V",
                            false))
                        method.instructions.insert(insn.label, inj2)
                        modified = true
                        println "  [ASM] Injected TileCompositor.traceTileRender into fu.ax data branch"
                        break
                    }
                }
                modified = true
                println "  [ASM] Injected TileCompositor.traceTileEnter into fu.ax"
            }
            if (method.name == "mx" && method.desc == "(Lfu;DILyz;I)Z") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceMxEnter",
                    "(Ljava/lang/Object;)V",
                    false))
                method.instructions.insert(inj)
                for (org.objectweb.asm.tree.AbstractInsnNode insn : method.instructions.toArray()) {
                    if (insn.opcode == org.objectweb.asm.Opcodes.IRETURN) {
                        org.objectweb.asm.tree.InsnList inj2 = new org.objectweb.asm.tree.InsnList()
                        inj2.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.DUP))
                        inj2.add(new org.objectweb.asm.tree.MethodInsnNode(
                            org.objectweb.asm.Opcodes.INVOKESTATIC,
                            "org/runelite/mobile/TileCompositor",
                            "traceMxResult",
                            "(I)V",
                            false))
                        method.instructions.insertBefore(insn, inj2)
                        modified = true
                    }
                }
                modified = true
                println "  [ASM] Injected TileCompositor.mx traces into fu.mx"
            }
        }
    }

    if (classNode.name == "gp") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "az" && method.desc == "(IILvv;III)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ILOAD, 1))
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ILOAD, 2))
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 3))
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceGate",
                    "(IILjava/lang/Object;)V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceGate into gp.az"
            }
            if (method.name == "em" && method.desc == "(Lgp;[Llw;IIIIIIIIIILvv;II)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 1))
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceGpEm",
                    "(Ljava/lang/Object;)V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceGpEm into gp.em"
            }
        }
    }

    if (classNode.name == "yw") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "es" && method.desc == "(IIII)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ILOAD, 0))
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ILOAD, 1))
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ILOAD, 2))
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ILOAD, 3))
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceYwEs",
                    "(IIII)V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceYwEs into yw.es"
            }
        }
    }

    if (classNode.name == "ff") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "aj" && method.desc == "(FFFFFFFFFIIIIIIIIIIIII)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceFqAj",
                    "()V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceFqAj into ff.aj"
            }
            if (method.name == "ct" && method.desc == "([I[IIIIIIIIFFIIIIII)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceFqCt",
                    "()V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceFqCt into ff.ct"
            }
            if (method.name == "bh" && method.desc == "([I[FIIIF)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceFfBh",
                    "()V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceFfBh into ff.bh"
            }
        }
    }

    if (classNode.name == "client") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "dg" && method.desc == "(Lzv;Lzv;Lzv;)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "traceDg",
                    "()V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.traceDg into client.dg"
            }
        }
    }

    if (classNode.name == "tg") {
        for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
            if (method.name == "af" && method.desc == "(IIB)V") {
                org.objectweb.asm.tree.InsnList inj = new org.objectweb.asm.tree.InsnList()
                inj.add(new org.objectweb.asm.tree.VarInsnNode(org.objectweb.asm.Opcodes.ALOAD, 0))
                inj.add(new org.objectweb.asm.tree.MethodInsnNode(
                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                    "org/runelite/mobile/TileCompositor",
                    "tracePresent",
                    "(Ljava/lang/Object;)V",
                    false))
                method.instructions.insert(inj)
                modified = true
                println "  [ASM] Injected TileCompositor.tracePresent into tg.af"
            }
        }
    }

    // Remap java/lang/ProcessHandle to org/runelite/mobile/ProcessHandle in class signatures
    if (classNode.signature != null) {
        if (classNode.signature.contains("Ljava/lang/ProcessHandle;")) {
            modified = true
            classNode.signature = classNode.signature.replace("Ljava/lang/ProcessHandle;", "Lorg/runelite/mobile/ProcessHandle;")
        }
        if (classNode.signature.contains("Ljava/lang/ProcessHandle\$Info;")) {
            modified = true
            classNode.signature = classNode.signature.replace("Ljava/lang/ProcessHandle\$Info;", "Lorg/runelite/mobile/ProcessHandle\$Info;")
        }
    }

    // Remap in fields
    for (org.objectweb.asm.tree.FieldNode field : classNode.fields) {
        if (field.desc != null && field.desc.contains("Ljava/lang/ProcessHandle;")) {
            modified = true
            field.desc = field.desc.replace("Ljava/lang/ProcessHandle;", "Lorg/runelite/mobile/ProcessHandle;")
        }
        if (field.desc != null && field.desc.contains("Ljava/lang/ProcessHandle\$Info;")) {
            modified = true
            field.desc = field.desc.replace("Ljava/lang/ProcessHandle\$Info;", "Lorg/runelite/mobile/ProcessHandle\$Info;")
        }
    }

    // Remap in methods signature/descriptor
    for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
        if (method.desc != null && method.desc.contains("Ljava/lang/ProcessHandle;")) {
            modified = true
            method.desc = method.desc.replace("Ljava/lang/ProcessHandle;", "Lorg/runelite/mobile/ProcessHandle;")
        }
        if (method.desc != null && method.desc.contains("Ljava/lang/ProcessHandle\$Info;")) {
            modified = true
            method.desc = method.desc.replace("Ljava/lang/ProcessHandle\$Info;", "Lorg/runelite/mobile/ProcessHandle\$Info;")
        }
    }

    // Field name per distinct dynamic constant (see loadDynamicConstant).
    java.util.Map dynConstantCache = new java.util.HashMap()

    for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
        org.objectweb.asm.tree.InsnList instructions = method.instructions
        org.objectweb.asm.tree.AbstractInsnNode[] insnArray = instructions.toArray()
        for (org.objectweb.asm.tree.AbstractInsnNode insn : insnArray) {
            if (insn instanceof org.objectweb.asm.tree.InvokeDynamicInsnNode) {
                org.objectweb.asm.tree.InvokeDynamicInsnNode indy = (org.objectweb.asm.tree.InvokeDynamicInsnNode) insn
                org.objectweb.asm.Handle bsm = indy.bsm
                if (bsm.getOwner() == "java/lang/invoke/StringConcatFactory" && 
                    bsm.getName() == "makeConcatWithConstants") {
                    
                    modified = true
                    String recipe = (String) indy.bsmArgs[0]
                    org.objectweb.asm.Type[] argTypes = org.objectweb.asm.Type.getArgumentTypes(indy.desc)
                    
                    org.objectweb.asm.tree.InsnList newInstructions = new org.objectweb.asm.tree.InsnList()
                    
                    // Store dynamic arguments into temp local variables in reverse order
                    int[] localSlots = new int[argTypes.length]
                    int currentSlot = method.maxLocals
                    for (int j = argTypes.length - 1; j >= 0; j--) {
                        org.objectweb.asm.Type type = argTypes[j]
                        localSlots[j] = currentSlot
                        newInstructions.add(new org.objectweb.asm.tree.VarInsnNode(type.getOpcode(org.objectweb.asm.Opcodes.ISTORE), currentSlot))
                        currentSlot += type.getSize()
                    }
                    method.maxLocals = Math.max(method.maxLocals, currentSlot)
                    
                    // Instantiate StringBuilder
                    newInstructions.add(new org.objectweb.asm.tree.TypeInsnNode(org.objectweb.asm.Opcodes.NEW, "java/lang/StringBuilder"))
                    newInstructions.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.DUP))
                    newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKESPECIAL, "java/lang/StringBuilder", "<init>", "()V", false))
                    
                    // Process recipe
                    StringBuilder literal = new StringBuilder()
                    int dynamicArgIndex = 0
                    int constantArgIndex = 0
                    
                    for (int j = 0; j < recipe.length(); j++) {
                        char ch = recipe.charAt(j)
                        if (ch == '\u0001') {
                            if (literal.length() > 0) {
                                newInstructions.add(new org.objectweb.asm.tree.LdcInsnNode(literal.toString()))
                                newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append", "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false))
                                literal.setLength(0)
                            }
                            org.objectweb.asm.Type type = argTypes[dynamicArgIndex]
                            int slot = localSlots[dynamicArgIndex]
                            newInstructions.add(new org.objectweb.asm.tree.VarInsnNode(type.getOpcode(org.objectweb.asm.Opcodes.ILOAD), slot))
                            String appendDesc = getAppendDesc(type)
                            newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append", appendDesc, false))
                            dynamicArgIndex++
                        } else if (ch == '\u0002') {
                            if (literal.length() > 0) {
                                newInstructions.add(new org.objectweb.asm.tree.LdcInsnNode(literal.toString()))
                                newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append", "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false))
                                literal.setLength(0)
                            }
                            Object constVal = indy.bsmArgs[1 + constantArgIndex]
                            constantArgIndex++
                            
                            if (constVal instanceof org.objectweb.asm.ConstantDynamic) {
                                org.objectweb.asm.ConstantDynamic cd = (org.objectweb.asm.ConstantDynamic) constVal
                                if (cd.getBootstrapMethod().getOwner() == "java/lang/invoke/ConstantBootstraps" && 
                                    cd.getBootstrapMethod().getName() == "invoke") {
                                    newInstructions.add(loadDynamicConstant(classNode, cd, dynConstantCache))
                                } else {
                                    newInstructions.add(new org.objectweb.asm.tree.LdcInsnNode(constVal))
                                }
                                newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append", "(Ljava/lang/Object;)Ljava/lang/StringBuilder;", false))
                            } else {
                                newInstructions.add(new org.objectweb.asm.tree.LdcInsnNode(constVal))
                                String appendDesc = getConstantAppendDesc(constVal)
                                newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append", appendDesc, false))
                            }
                        } else {
                            literal.append(ch)
                        }
                    }
                    if (literal.length() > 0) {
                        newInstructions.add(new org.objectweb.asm.tree.LdcInsnNode(literal.toString()))
                        newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "append", "(Ljava/lang/String;)Ljava/lang/StringBuilder;", false))
                    }
                    
                    // toString
                    newInstructions.add(new org.objectweb.asm.tree.MethodInsnNode(org.objectweb.asm.Opcodes.INVOKEVIRTUAL, "java/lang/StringBuilder", "toString", "()Ljava/lang/String;", false))
                    
                    // Replace InvokeDynamicInsnNode with newInstructions
                    instructions.insertBefore(indy, newInstructions)
                    instructions.remove(indy)
                }
            } else if (insn instanceof org.objectweb.asm.tree.LdcInsnNode) {
                org.objectweb.asm.tree.LdcInsnNode ldc = (org.objectweb.asm.tree.LdcInsnNode) insn
                if (ldc.cst instanceof org.objectweb.asm.Type) {
                    org.objectweb.asm.Type t = (org.objectweb.asm.Type) ldc.cst
                    if (t.getSort() == org.objectweb.asm.Type.OBJECT) {
                        if (t.getInternalName() == "java/lang/ProcessHandle") {
                            modified = true
                            ldc.cst = org.objectweb.asm.Type.getObjectType("org/runelite/mobile/ProcessHandle")
                        } else if (t.getInternalName() == "java/lang/ProcessHandle\$Info") {
                            modified = true
                            ldc.cst = org.objectweb.asm.Type.getObjectType("org/runelite/mobile/ProcessHandle\$Info")
                        }
                    }
                }
                if (ldc.cst instanceof org.objectweb.asm.ConstantDynamic) {
                    org.objectweb.asm.ConstantDynamic cd = (org.objectweb.asm.ConstantDynamic) ldc.cst
                    if (cd.getBootstrapMethod().getOwner() == "java/lang/invoke/ConstantBootstraps" &&
                        cd.getBootstrapMethod().getName() == "invoke") {
                        modified = true
                        instructions.insertBefore(ldc, loadDynamicConstant(classNode, cd, dynConstantCache))
                        instructions.remove(ldc)
                    }
                }
            } else if (insn instanceof org.objectweb.asm.tree.FieldInsnNode) {
                org.objectweb.asm.tree.FieldInsnNode fieldInsn = (org.objectweb.asm.tree.FieldInsnNode) insn
                if (fieldInsn.getOpcode() == org.objectweb.asm.Opcodes.GETSTATIC && 
                    fieldInsn.owner == "sun/misc/Unsafe") {
                    if (fieldInsn.name.startsWith("ARRAY_") && fieldInsn.desc == "I") {
                        modified = true
                        fieldInsn.owner = "org/runelite/mobile/UnsafeHelper"
                        println "  [ASM] Rewrote GETSTATIC sun/misc/Unsafe." + fieldInsn.name + " to org/runelite/mobile/UnsafeHelper." + fieldInsn.name
                    }
                }
            } else if (insn instanceof org.objectweb.asm.tree.MethodInsnNode) {
                org.objectweb.asm.tree.MethodInsnNode methodInsn = (org.objectweb.asm.tree.MethodInsnNode) insn
                if (methodInsn.owner == "sun/misc/Unsafe" && methodInsn.name == "copyMemory") {
                    modified = true
                    methodInsn.setOpcode(org.objectweb.asm.Opcodes.INVOKESTATIC)
                    methodInsn.owner = "org/runelite/mobile/UnsafeHelper"
                    if (methodInsn.desc == "(Ljava/lang/Object;JLjava/lang/Object;JJ)V") {
                        methodInsn.desc = "(Ljava/lang/Object;Ljava/lang/Object;JLjava/lang/Object;JJ)V"
                    } else if (methodInsn.desc == "(JJJ)V") {
                        methodInsn.desc = "(Ljava/lang/Object;JJJ)V"
                    }
                    println "  [ASM] Rewrote INVOKEVIRTUAL sun/misc/Unsafe.copyMemory" + methodInsn.desc + " to INVOKESTATIC org/runelite/mobile/UnsafeHelper.copyMemory"
                } else {
                    if (methodInsn.owner == "java/lang/ProcessHandle") {
                        modified = true
                        methodInsn.owner = "org/runelite/mobile/ProcessHandle"
                    } else if (methodInsn.owner == "java/lang/ProcessHandle\$Info") {
                        modified = true
                        methodInsn.owner = "org/runelite/mobile/ProcessHandle\$Info"
                    }
                    if (methodInsn.desc != null && methodInsn.desc.contains("Ljava/lang/ProcessHandle;")) {
                        modified = true
                        methodInsn.desc = methodInsn.desc.replace("Ljava/lang/ProcessHandle;", "Lorg/runelite/mobile/ProcessHandle;")
                    }
                    if (methodInsn.desc != null && methodInsn.desc.contains("Ljava/lang/ProcessHandle\$Info;")) {
                        modified = true
                        methodInsn.desc = methodInsn.desc.replace("Ljava/lang/ProcessHandle\$Info;", "Lorg/runelite/mobile/ProcessHandle\$Info;")
                    }
                }
            } else if (insn instanceof org.objectweb.asm.tree.TypeInsnNode) {
                org.objectweb.asm.tree.TypeInsnNode typeInsn = (org.objectweb.asm.tree.TypeInsnNode) insn
                if (typeInsn.desc == "java/lang/ProcessHandle") {
                    modified = true
                    typeInsn.desc = "org/runelite/mobile/ProcessHandle"
                } else if (typeInsn.desc == "java/lang/ProcessHandle\$Info") {
                    modified = true
                    typeInsn.desc = "org/runelite/mobile/ProcessHandle\$Info"
                }
            }
        }
    }

    // Neutralize the crash beacon by construction: any method that builds a
    // "clienterror.ws..." URL is a caller of Jagex's crash reporter, which ships
    // a stack trace (possibly containing this port's class names) along with the
    // player's user id. Force such methods to return immediately. Constructors
    // and static initializers are left alone so class initialization keeps working.
    for (org.objectweb.asm.tree.MethodNode method : classNode.methods) {
        if (method.name == "<init>" || method.name == "<clinit>") {
            continue
        }
        boolean beacon = false
        for (org.objectweb.asm.tree.AbstractInsnNode insn : method.instructions.toArray()) {
            if (insn instanceof org.objectweb.asm.tree.LdcInsnNode) {
                Object cst = ((org.objectweb.asm.tree.LdcInsnNode) insn).cst
                if (cst instanceof String && ((String) cst).startsWith("clienterror.ws")) {
                    beacon = true
                    break
                }
            }
        }
        if (beacon) {
            org.objectweb.asm.tree.InsnList ret = new org.objectweb.asm.tree.InsnList()
            int sort = org.objectweb.asm.Type.getReturnType(method.desc).getSort()
            if (sort == org.objectweb.asm.Type.VOID) {
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.RETURN))
            } else if (sort == org.objectweb.asm.Type.LONG) {
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.LCONST_0))
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.LRETURN))
            } else if (sort == org.objectweb.asm.Type.FLOAT) {
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.FCONST_0))
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.FRETURN))
            } else if (sort == org.objectweb.asm.Type.DOUBLE) {
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.DCONST_0))
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.DRETURN))
            } else if (sort == org.objectweb.asm.Type.OBJECT || sort == org.objectweb.asm.Type.ARRAY) {
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.ACONST_NULL))
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.ARETURN))
            } else {
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.ICONST_0))
                ret.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.IRETURN))
            }
            method.instructions.insert(ret)
            modified = true
            println "  [ASM] Neutered crash beacon in " + classNode.name + "." + method.name
        }
    }

    if (modified) {
        org.objectweb.asm.ClassWriter writer = new org.objectweb.asm.ClassWriter(org.objectweb.asm.ClassWriter.COMPUTE_FRAMES) {
            @Override
            protected String getCommonSuperClass(String type1, String type2) {
                try {
                    return super.getCommonSuperClass(type1, type2)
                } catch (Throwable t) {
                    return "java/lang/Object"
                }
            }
        }
        classNode.accept(writer)
        return writer.toByteArray()
    }
    return classBytes
}

/**
 * Emits bytecode that evaluates a ConstantBootstraps.invoke dynamic constant,
 * leaving its value on the stack.
 *
 * d8 cannot compile CONSTANT_Dynamic at all ("Unsupported dynamic constant
 * (has arguments to bootstrap method)"), so every such constant must be
 * rewritten into explicit bytecode. But the JVM resolves a CONSTANT_Dynamic
 * ONCE per constant-pool entry and then hands out that same instance for every
 * evaluation -- and the obfuscator relies on exactly that to express
 * singletons without static fields: client.ib()/ar.zb()/client.wc()/... all
 * return a fresh `new T[1]`, one call site stores into element 0 through the
 * constant and every other call site reads it back (see client.hr / client.at
 * / client.lk). Rewriting the constant into a plain INVOKESTATIC would
 * allocate a brand-new array on every evaluation and silently break the
 * singleton -- client init then NPEs on the still-null element.
 *
 * So the value is memoized in a synthetic static field shared by every
 * evaluation site of the same constant (ASM's ConstantDynamic equality matches
 * the JVM's constant-pool dedup). Sites whose constant type is a primitive, or
 * classes that are interfaces (where a non-final static field is illegal),
 * fall back to a plain evaluation.
 */
org.objectweb.asm.tree.InsnList loadDynamicConstant(
        org.objectweb.asm.tree.ClassNode classNode,
        org.objectweb.asm.ConstantDynamic cd,
        java.util.Map dynConstantCache) {

    org.objectweb.asm.Handle targetMethod = (org.objectweb.asm.Handle) cd.getBootstrapMethodArgument(0)
    int opcode = getInvokeOpcode(targetMethod.getTag())
    boolean isInterface = targetMethod.getTag() == org.objectweb.asm.Opcodes.H_INVOKEINTERFACE

    org.objectweb.asm.tree.InsnList insns = new org.objectweb.asm.tree.InsnList()
    int sort = org.objectweb.asm.Type.getType(cd.getDescriptor()).getSort()
    boolean cacheable = (classNode.access & org.objectweb.asm.Opcodes.ACC_INTERFACE) == 0 &&
        (sort == org.objectweb.asm.Type.OBJECT || sort == org.objectweb.asm.Type.ARRAY)

    if (cacheable) {
        String fieldName = (String) dynConstantCache.get(cd)
        if (fieldName == null) {
            String base = "\$dync\$"
            int n = 0
            while (classNode.fields.any { it.name == base + n }) {
                n++
            }
            fieldName = base + n
            dynConstantCache.put(cd, fieldName)
            classNode.fields.add(new org.objectweb.asm.tree.FieldNode(
                org.objectweb.asm.Opcodes.ACC_PRIVATE | org.objectweb.asm.Opcodes.ACC_STATIC | org.objectweb.asm.Opcodes.ACC_SYNTHETIC,
                fieldName, cd.getDescriptor(), null, null))
        }
        org.objectweb.asm.tree.LabelNode cached = new org.objectweb.asm.tree.LabelNode()
        insns.add(new org.objectweb.asm.tree.FieldInsnNode(org.objectweb.asm.Opcodes.GETSTATIC,
            classNode.name, fieldName, cd.getDescriptor()))
        insns.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.DUP))
        insns.add(new org.objectweb.asm.tree.JumpInsnNode(org.objectweb.asm.Opcodes.IFNONNULL, cached))
        insns.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.POP))
        appendDynamicConstantValue(insns, cd, opcode, targetMethod, isInterface)
        insns.add(new org.objectweb.asm.tree.InsnNode(org.objectweb.asm.Opcodes.DUP))
        insns.add(new org.objectweb.asm.tree.FieldInsnNode(org.objectweb.asm.Opcodes.PUTSTATIC,
            classNode.name, fieldName, cd.getDescriptor()))
        insns.add(cached)
    } else {
        appendDynamicConstantValue(insns, cd, opcode, targetMethod, isInterface)
    }
    return insns
}

/** Pushes the bootstrap arguments (if any) and invokes the constant's target method. */
void appendDynamicConstantValue(org.objectweb.asm.tree.InsnList insns, org.objectweb.asm.ConstantDynamic cd,
                                int opcode, org.objectweb.asm.Handle targetMethod, boolean isInterface) {
    for (int k = 1; k < cd.getBootstrapMethodArgumentCount(); k++) {
        insns.add(new org.objectweb.asm.tree.LdcInsnNode(cd.getBootstrapMethodArgument(k)))
    }
    insns.add(new org.objectweb.asm.tree.MethodInsnNode(opcode, targetMethod.getOwner(),
        targetMethod.getName(), targetMethod.getDesc(), isInterface))
}

int getInvokeOpcode(int tag) {
    switch (tag) {
        case org.objectweb.asm.Opcodes.H_INVOKESTATIC:    return org.objectweb.asm.Opcodes.INVOKESTATIC
        case org.objectweb.asm.Opcodes.H_INVOKEVIRTUAL:   return org.objectweb.asm.Opcodes.INVOKEVIRTUAL
        case org.objectweb.asm.Opcodes.H_INVOKESPECIAL:   return org.objectweb.asm.Opcodes.INVOKESPECIAL
        case org.objectweb.asm.Opcodes.H_INVOKEINTERFACE: return org.objectweb.asm.Opcodes.INVOKEINTERFACE
        default: throw new IllegalArgumentException("Unsupported method handle tag: " + tag)
    }
}

String getAppendDesc(org.objectweb.asm.Type type) {
    switch (type.getSort()) {
        case org.objectweb.asm.Type.BOOLEAN: return "(Z)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.CHAR:    return "(C)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.BYTE:
        case org.objectweb.asm.Type.SHORT:
        case org.objectweb.asm.Type.INT:     return "(I)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.LONG:    return "(J)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.FLOAT:   return "(F)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.DOUBLE:  return "(D)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.OBJECT:
            if (type.getInternalName() == "java/lang/String") {
                return "(Ljava/lang/String;)Ljava/lang/StringBuilder;"
            }
            return "(Ljava/lang/Object;)Ljava/lang/StringBuilder;"
        case org.objectweb.asm.Type.ARRAY:   return "(Ljava/lang/Object;)Ljava/lang/StringBuilder;"
        default:                             return "(Ljava/lang/Object;)Ljava/lang/StringBuilder;"
    }
}

String getConstantAppendDesc(Object constVal) {
    if (constVal instanceof Integer) return "(I)Ljava/lang/StringBuilder;"
    if (constVal instanceof Long) return "(J)Ljava/lang/StringBuilder;"
    if (constVal instanceof Float) return "(F)Ljava/lang/StringBuilder;"
    if (constVal instanceof Double) return "(D)Ljava/lang/StringBuilder;"
    if (constVal instanceof String) return "(Ljava/lang/String;)Ljava/lang/StringBuilder;"
    if (constVal instanceof Character) return "(C)Ljava/lang/StringBuilder;"
    if (constVal instanceof Boolean) return "(Z)Ljava/lang/StringBuilder;"
    return "(Ljava/lang/Object;)Ljava/lang/StringBuilder;"
}


