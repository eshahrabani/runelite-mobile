name: Weekly RuneLite Mobile Build

on:
  schedule:
    # Run every Wednesday at 13:00 UTC (approximately after Jagex updates OSRS)
    - cron: '0 13 * * 3'
  workflow_dispatch:
    # Allow manual triggers for testing or mid-week hotfixes

jobs:
  build-android:
    name: Build Android Client (Option A Wrapper)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: ./gradlew :android:assembleRelease

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: runelite-android-release
          path: android/build/outputs/apk/release/android-release.apk

  build-ios:
    name: Compile iOS Client (RoboVM Native AOT)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer

      - name: Compile iOS Native App (IPA)
        run: ./gradlew :ios:robovmIPABuild
        env:
          ROBOVM_SKIP_SIGNING: "true" # Skip signing for AltStore / OTA distribution

      - name: Upload iOS Sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: runelite-ios-unsigned
          path: ios/build/robovm/RuneLiteMobile.ipa

  distribute:
    name: Publish Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release (AltStore / OTA Sideload Source)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: weekly-release-${{ github.run_number }}
          name: Weekly Release - ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            runelite-android-release/*.apk
            runelite-ios-unsigned/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # In a production setup: Include Fastlane steps here to submit to App Store Connect / TestFlight
