name: Weekly RuneLite Mobile Build

on:
  schedule:
    # Downtime target: <15 min from RuneLite publishing a client for a new game revision to
    # the release being pullable, so a weekly OSRS update never leaves the game unplayable
    # for long. A whole run costs ~190 s measured (run #11: Android job 177 s, publish 7 s)
    # and the `check` job below skips the expensive jobs when the published client is
    # already current, so wide slots are cheap. RuneLite's recent publishes (jar
    # Last-Modified, UTC): Wed 09:45 (1.13.1), Wed 10:07 (1.12.37), Wed 14:31 (1.12.39),
    # Wed 16:23 (1.12.38), Wed 18:09 (1.13.2), Mon 14:16 (1.13.0); Jagex updates OSRS
    # ~10:00-11:00 UTC on Wednesdays. GitHub may add a few minutes of jitter to scheduled
    # runs, and disables schedules after 60 days without repository activity (any push
    # re-enables them).
    - cron: '*/5 7-21 * * 3'        # Wednesday: the weekly-update window, <=5 min detection
    - cron: '*/10 0-6,22-23 * * 3'  # Wednesday night: a late publish is not missed
    - cron: '*/15 0-12 * * 4'       # Thursday: hotfixes after a stalled Wednesday
    - cron: '0 */2 * * *'           # other days: off-schedule releases (1.13.0 was a Monday)
  workflow_dispatch:
    # Manual triggers skip the freshness guard and always build (hotfixes/testing).

# Needed so the distribute job can create a GitHub Release (new repos default
# the GITHUB_TOKEN to read-only).
permissions:
  contents: write

jobs:
  # Cheap freshness guard: the building jobs only run when bootstrap.json names a client
  # version the latest release does not carry yet. The criterion mirrors the app's own
  # update trigger (ClientUpdater compares client-version.txt exactly), so a same-version
  # rebuild by RuneLite would never reach a user anyway. No checkout, no JDK: a no-op run
  # is one curl against bootstrap.json plus one against the release.
  check:
    name: Check RuneLite version
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - name: Compare bootstrap.json with the latest release
        id: compare
        run: |
          bootstrap="$(curl -fsS --max-time 30 https://static.runelite.net/bootstrap.json || echo '')"
          published="$(printf '%s' "$bootstrap" | sed -n 's/.*"name": "client-\([0-9][^"]*\)\.jar".*/\1/p' | head -n1)"
          released="$(curl -fsS --max-time 30 -L "https://github.com/${{ github.repository }}/releases/latest/download/client-version.txt" || echo '')"
          echo "bootstrap.json client: ${published:-<unreachable>} | latest release: ${released:-<none>}"
          if [ -n "$published" ] && [ "$published" = "$released" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Up to date: the client RuneLite publishes ($released) is already released."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "A build is needed."
          fi

  build-android:
    name: Build Android Client (Option A Wrapper)
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDK 17: android-actions/setup-android@v4 with cmdline-tools-version 12266719 installs cmdline-tools 16.0, whose
      # sdkmanager requires JDK 17+ ("This tool requires JDK 17 or later. Your
      # version was detected as 11.0.32." -> exit 1), and AGP 8.2.2 itself requires
      # JDK 17 to run. Bytecode stays Java 11: android/build.gradle pins
      # sourceCompatibility/targetCompatibility 11, and JDK 17's javac still
      # honours core/'s --limit-modules java.base,jdk.unsupported.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # @v4, not @v3: @v3's default `packages` is the literal "tools platform-tools" and
      # Google no longer serves the legacy `tools` package (it is absent from
      # repository2-3.xml), so `sdkmanager tools` exits 1 with "Failed to find package
      # 'tools'" and the step dies before the build starts. Both inputs are pinned so no
      # 4.x default can install anything here either:
      #  - packages: '' — the action's package loop then runs zero sdkmanager installs.
      #    This job needs no packages: ubuntu-latest already ships platforms;android-34
      #    and build-tools (AGP's aapt2/d8 plus downloadAndDexJar's <build-tools>/d8),
      #    and adb/platform-tools is never invoked by this workflow.
      #  - cmdline-tools-version 12266719 (16.0) — the version this job's JDK 17 is
      #    already proven against (its `sdkmanager --licenses` succeeds in the current
      #    runs) and the one preinstalled on the runner image, so the ~130 MB
      #    cmdline-tools download only happens if the image ever drops it.
      # The action is kept for licence acceptance (AGP's SDK auto-download reads
      # <sdk>/licenses), the ANDROID_HOME/ANDROID_SDK_ROOT exports, PATH and the
      # problem matchers.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719' # 16.0
          packages: ''

      # The APK's signing identity must be identical in every run, or no update can be
      # installed over a previous one: Android rejects it with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE and the user has to uninstall -- losing the
      # RuneLite config under files/.runelite and the saved sign-in. The keystore lives in
      # repo secrets; without them the build falls back to the runner's auto-generated
      # debug keystore (whose key changes every run) and packageRelease says so.
      #   base64 -w0 <keystore> | gh secret set SIGNING_KEYSTORE_B64
      #   printf %s '<password>' | gh secret set SIGNING_KEYSTORE_PASSWORD
      - name: Write release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No SIGNING_KEYSTORE_B64/SIGNING_KEYSTORE_PASSWORD secret: signing with the debug keystore, so this APK will not install over a previous release."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=runelitemobile"
          } >> "$GITHUB_ENV"
          echo "Release keystore ready (alias runelitemobile)."

      - name: Build Android APK
        run: ./gradlew :android:assembleRelease

      - name: Checksum the dexed client
        run: sha256sum android/src/main/assets/runelite-dex.jar | awk '{print $1}' > android/src/main/assets/runelite-dex.jar.sha256

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: runelite-android-release
          path: |
            android/build/outputs/apk/release/android-release.apk
            android/src/main/assets/runelite-dex.jar
            android/src/main/assets/runelite-dex.jar.sha256
            android/src/main/assets/client-version.txt

  build-ios:
    name: Compile iOS Client (RoboVM Native AOT)
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check.outputs.build == 'true' }}
    runs-on: macos-latest
    # Skeleton target: a Toolchain/Xcode incompatibility must not turn the weekly
    # client build red; the IPA stays a workflow artifact.
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Xcode
        # Version-agnostic: macos-latest no longer ships the pinned
        # Xcode_15.0.1.app ("invalid developer directory"). Pick the newest
        # Xcode the runner image has and print it for the log.
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Compile iOS Native App (IPA)
        run: ./gradlew :ios:robovmIPABuild
        env:
          ROBOVM_SKIP_SIGNING: "true" # Skip signing for AltStore / OTA distribution

      - name: Upload iOS Sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: runelite-ios-unsigned
          path: ios/build/robovm/RuneLiteMobile.ipa

  distribute:
    name: Publish Releases
    # Only the Android job gates client delivery: a failing macOS-only iOS
    # skeleton job must never block shipping the client. The IPA stays a
    # workflow artifact (runelite-ios-unsigned). `skipped` (freshness guard said
    # there is nothing new) and `failure` both mean there is nothing to publish.
    needs: [build-android]
    if: ${{ needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      # Immutable releases are on for this repo: a *published* release rejects asset
      # uploads (run #9: 422 "Cannot upload assets to an immutable release" on the
      # first of the four), so this step creates the release as a draft, attaches the
      # assets to it, and the step below publishes the draft — GitHub's documented
      # order ("create the release as a draft, attach all associated assets, then
      # publish the draft").
      - name: Create GitHub Release (AltStore / OTA Sideload Source)
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: weekly-release-${{ github.run_number }}
          name: Weekly Release - ${{ github.run_number }}
          draft: true
          prerelease: false
          # `**`, not literal paths: upload-artifact@v4 roots the artifact at the least
          # common ancestor of the uploaded paths — `android/` here, since the APK is
          # under android/build/outputs/apk/release/ and the jar, its sha256 and the
          # version file under android/src/main/assets/ — so download-artifact extracts
          # runelite-android-release/{build/outputs/apk/release,src/main/assets}/… .
          # The literal paths matched nothing, and the action's default
          # fail_on_unmatched_files=false let that run stay green with an empty release
          # (run #8 = weekly-release-8: zero assets, every releases/latest/download/<name>
          # a 404), so the flag is now on — an unmatched pattern fails this step before a
          # release is created, instead of publishing nothing. Asset names are the
          # basename of each match (asset() in the action's src/github.ts), so these four
          # keep the exact names ClientUpdater and the sideload links fetch.
          # The IPA is deliberately absent: the iOS job is continue-on-error and fails,
          # so runelite-ios-unsigned/<file>.ipa can never match and this flag would reject
          # the run for it. The IPA stays a workflow artifact; add it back here once that
          # job goes green (then the pattern always matches and the flag can stay).
          fail_on_unmatched_files: true
          files: |
            runelite-android-release/**/*.apk
            runelite-android-release/**/runelite-dex.jar
            runelite-android-release/**/runelite-dex.jar.sha256
            runelite-android-release/**/client-version.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PATCH by the id this run's action reported, not by tag: releases/tags/<tag>
      # does not return a draft (the action's own draft branch lists all releases for
      # that reason), and publishing the draft is what makes the release immutable.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X PATCH "repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }}" -F draft=false --jq .html_url

      # In a production setup: Include Fastlane steps here to submit to App Store Connect / TestFlight
